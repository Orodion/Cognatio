# Installer and packages of the desktop app (Windows: npm run desktop:dist, Linux: npm run dist:linux -w desktop) – see documentation/distribution-concept.md, section 3.3
appId: app.cognatio.desktop
productName: Cognatio
# Chromium language files: only the languages of the app (native menus and dialogs); en-US is the fallback
electronLanguages: [en-US, de, es, fr, it, nl, pl, pt-BR, pt-PT, ru, uk]
directories:
  output: release
# node_modules of the backend: see scripts/afterPack.cjs
afterPack: scripts/afterPack.cjs
# Hardening of the program file (Electron fuses): it cannot be misused to run other scripts – no ELECTRON_RUN_AS_NODE,
# no NODE_OPTIONS, no --inspect – and it only loads its own app.asar. The backend therefore runs as an Electron utility
# process (src/utilityBackend.ts). Tests of the installed app drive it through --remote-debugging-port (scripts/smoke.mjs).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
files:
  - dist/**
  - package.json
# Backend, web app and PostgreSQL next to the program (outside the asar archive: the backend runs as its own process)
extraResources:
  - from: stage/backend
    to: backend
  - from: stage/frontend
    to: frontend
  - from: stage/postgres
    to: postgres
  # Example family tree that the backend creates on the first start (backend/src/lib/demo/seedDemo.ts)
  - from: ../demo/Cognatio-Demo-Familie-Kraft.zip
    to: demo/Cognatio-Demo-Familie-Kraft.zip
  # Icon for the menu entry the AppImage creates for itself (desktopEntry.ts)
  - from: build/icon.png
    to: icon.png
  # Licence of Cognatio and of everything it contains (generated by scripts/third-party-notices.mjs)
  - from: ../LICENSE
    to: licenses/LICENSE.txt
  - from: ../THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
# Update feed: latest.yml and the installer are assets of the newest release; the address always points to the latest one.
# The app sets the feed itself at run time (src/feeds.ts, which also knows the beta channel), this one only goes into
# app-update.yml. scripts/public-snapshot.mjs turns it into the GitHub form (…/releases/latest/download) for the public
# repository (.github/workflows/release.yml); here it is the GitLab one (.gitlab-ci.yml, job release:publish).
publish:
  provider: generic
  url: https://github.com/Orodion/Cognatio/releases/latest/download
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Not signed yet (set CSC_LINK / CSC_KEY_PASSWORD in the pipeline); the icon and version info are still written into the exe
  signExecutable: false
# Linux (npm run dist:linux -w desktop): the AppImage updates itself from latest-linux.yml / beta-linux.yml in the same
# feeds and puts itself into the application menu; the .deb brings its libraries along (apt installs the dependencies),
# sets up the sandbox and the menu entry, and is updated with the system (no self-update)
linux:
  icon: build/icon.png
  executableName: cognatio
  syncDesktopName: true
  category: Office
  synopsis: Family tree software
  maintainer: Cognatio <noreply@localhost>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: Cognatio-${version}.${ext}
nsis:
  # Per user, no administrator rights; program in %LOCALAPPDATA%\Programs\Cognatio, data in %APPDATA%\Cognatio
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # The uninstaller keeps the data (family trees); an interactive uninstall asks twice whether to delete them (build/installer.nsh)
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  # Setup and uninstaller follow the language of Windows: the languages of the app (English for all others)
  installerLanguages: [en_US, de_DE, es_ES, fr_FR, it_IT, nl_NL, pl_PL, pt_BR, pt_PT, ru_RU, uk_UA]
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Cognatio-Setup-${version}.${ext}
