# Builds the desktop apps: Windows installer and portable ZIP, Linux AppImage and .deb, each with its update feed file.
# By hand (Actions → Desktop build → Run workflow) it is the trial run of the build: the files stay as artifacts for
# seven days, nothing is published (like the manual jobs build:windows and build:linux in .gitlab-ci.yml).
# .github/workflows/release.yml calls it for a tag and publishes the artifacts.
# Signing: with the repository secrets CSC_LINK (certificate as base64 or URL) and CSC_KEY_PASSWORD the Windows installer
# is signed, without them it is not.
name: Desktop build

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  # electron-builder downloads the Electron it packs itself; the binary of the npm package is not needed
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      # The virus scanner stays on, but ignores the build folder, the temp folder and node.exe: npm creates thousands of
      # small files there, which it would check one by one (the machine is thrown away after the job)
      - name: Virus scanner exclusion
        run: try { Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP -ExclusionProcess node.exe -ErrorAction Stop; Write-Host "virus scanner ignores the build folder" } catch { Write-Host "virus scanner exclusion not possible, going on" }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The same version as NODE_VERSION in .gitlab-ci.yml
          node-version: 22.23.3
          cache: npm
      # Electron and electron-builder tools, and the PostgreSQL binaries (about 250 MB from EDB)
      - uses: actions/cache@v5
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: tools/postgres
          key: postgres-${{ runner.os }}-${{ hashFiles('scripts/fetch-postgres.mjs') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run postgres:fetch
      - name: Installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $extra = @()
          if ($env:CSC_LINK) { $extra += "-c.win.signAndEditExecutable=true" } else { Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }
          npm run dist -w desktop -- --publish never @extra
      - name: Portable ZIP
        run: node desktop/scripts/portable.mjs
      - run: Get-ChildItem desktop/release -File | Select-Object Name, Length
      - uses: actions/upload-artifact@v6
        with:
          name: app-windows
          # latest.yml of a release, beta.yml of a test version (electron-builder names it after the version)
          path: |
            desktop/release/Cognatio-Setup-*.exe
            desktop/release/Cognatio-Setup-*.exe.blockmap
            desktop/release/Cognatio-*-portable.zip
            desktop/release/latest.yml
            desktop/release/beta.yml
          if-no-files-found: error
          retention-days: 7

  # PostgreSQL is built from the official source archive (scripts/fetch-postgres.mjs, about three minutes, cached)
  # because there are no relocatable binaries; the image is the one of .gitlab-ci.yml (same glibc for the AppImage)
  linux:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: tools/postgres
          key: postgres-linux-${{ hashFiles('scripts/fetch-postgres.mjs') }}
      - run: npm ci --prefer-offline --no-audit --no-fund --cache .npm
      - run: npm run postgres:fetch
      - run: npm run dist:linux -w desktop
      - run: ls -l desktop/release
      - uses: actions/upload-artifact@v6
        with:
          name: app-linux
          # latest-linux.yml of a release, beta-linux.yml of a test version
          path: |
            desktop/release/Cognatio-*.AppImage
            desktop/release/Cognatio-*.deb
            desktop/release/latest-linux.yml
            desktop/release/beta-linux.yml
          if-no-files-found: error
          retention-days: 7
